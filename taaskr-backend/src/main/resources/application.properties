spring.application.name=taaskr-backend
spring.profiles.default=local
server.port=${PORT:8081}

spring.jpa.open-in-view=false

# Comma-separated browser origins that may call the API directly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator & Observability Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true

# Metric tags
management.metrics.tags.application=taaskr-backend
management.metrics.export.prometheus.enabled=true

# Spring Mail & SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# App Email Settings
app.email.from=${MAIL_FROM:noreply@taaskr.com}
app.email.simulation-mode=${EMAIL_SIMULATION_MODE:auto}


