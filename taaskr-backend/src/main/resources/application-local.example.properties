# Copy this file to application-local.properties, then fill in the values.
# application-local.properties is intentionally ignored by Git.
spring.datasource.url=jdbc:mysql://localhost:3306/taaskr_db_local?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=replace-with-your-local-mysql-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=replace-with-a-long-random-local-secret
app.jwt.expiration-ms=86400000

razorpay.key.id=your-razorpay-test-key-id
razorpay.key.secret=your-razorpay-test-key-secret

app.seed.demo-data=true
