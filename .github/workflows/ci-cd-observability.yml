name: Taaskr CI/CD & Observability Validation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: Backend Build & Automated Observability Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: taaskr_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Unit & Integration Tests
        run: |
          cd taaskr-backend
          mvn test -Dspring.profiles.active=test

  frontend-build:
    name: Frontend Build & Asset Bundle Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: taaskr-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd taaskr-frontend
          npm ci

      - name: Build Production Web App
        run: |
          cd taaskr-frontend
          npm run build

  docker-compose-validation:
    name: Docker Compose Monitoring Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Monitoring File
        run: |
          docker compose -f docker-compose.monitoring.yml config
