global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'taaskr-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # host.docker.internal allows Prometheus inside Docker to scrape the Spring Boot backend running on the host machine
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8080']
        labels:
          application: 'taaskr-backend'
          environment: 'development'
