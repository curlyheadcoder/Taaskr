global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Local Development Spring Boot Backend
  - job_name: 'taaskr-backend-local'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8080']
        labels:
          application: 'taaskr-backend'
          environment: 'development'

  # Live Production Backend Hosted on Render
  - job_name: 'taaskr-backend-render-prod'
    metrics_path: '/actuator/prometheus'
    scheme: 'https'
    scrape_interval: 10s
    static_configs:
      - targets: ['taaskr-backend.onrender.com:443']
        labels:
          application: 'taaskr-backend'
          environment: 'production'
