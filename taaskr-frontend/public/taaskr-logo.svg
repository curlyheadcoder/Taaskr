<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2235" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0B0D14" />
    </linearGradient>

    <!-- Primary Amber Gold Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Vibrant Accent Orange/Gold -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>

    <!-- Subtle Inner Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#4B5563" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Container Squircle / Rounded Shield -->
  <rect 
    x="4" 
    y="4" 
    width="92" 
    height="92" 
    rx="24" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="2" 
  />

  <!-- Ambient Glow Center -->
  <circle cx="50" cy="50" r="28" fill="#F59E0B" opacity="0.12" filter="blur(10px)" />

  <!-- Modern Dynamic "T" & Fast Task Checkmark Monogram -->
  <g filter="url(#amberGlow)">
    <!-- Top Horizontal Bar of T -->
    <path 
      d="M 22 28 C 22 25.5 24 23.5 26.5 23.5 L 73.5 23.5 C 76 23.5 78 25.5 78 28 L 78 33.5 C 78 35.5 76.5 37 74.5 37 L 57.5 37 L 57.5 44 L 42.5 44 L 42.5 37 L 25.5 37 C 23.5 37 22 35.5 22 33.5 Z" 
      fill="url(#amberGrad)" 
    />

    <!-- Dynamic Interlocking Stem & Checkmark Arrow -->
    <path 
      d="M 42.5 42 L 57.5 42 L 57.5 59 C 57.5 61 56.5 62.5 54.8 63.5 L 35 76 C 33.2 77.2 30.8 76.2 30.8 74 L 30.8 68 C 30.8 66.5 31.6 65.2 32.8 64.4 L 42.5 58 Z" 
      fill="url(#accentGrad)" 
    />

    <!-- Forward Fast Checkmark Tick / Arrow Accent -->
    <path 
      d="M 49 54 L 69.5 72.5 C 71 73.8 73.5 73 73.5 71 L 73.5 64 C 73.5 62.6 72.8 61.4 71.8 60.5 L 56 46.5 Z" 
      fill="url(#amberGrad)" 
    />

    <!-- Spark / Energy Highlight Dot -->
    <circle cx="73" cy="28.5" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
